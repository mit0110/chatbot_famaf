{% extends "base.html" %}

{% block title %}Editar Pregunta{% endblock %}

{% block content %}
<h1>Editar Pregunta</h1>

<form action="/admin/edit/{{ question._id }}" method="post">

    <div class="mb-3">
        <label for="content" class="form-label">Contenido de la Pregunta</label>
        <textarea class="form-control" id="content" name="content" rows="3" required>{{ question.content }}</textarea>
    </div>

    <div class="mb-3">
        <label for="category" class="form-label">Categoría</label>
        <input type="text" class="form-control" id="category" name="category" value="{{ question.category }}" required>
    </div>

    <div class="mb-3">
        <label for="answer_content" class="form-label">Respuesta</label>
        <textarea class="form-control" id="answer_content" name="answer_content" rows="4"
            required>{{ question.answer.content if question.answer else '' }}</textarea>
    </div>

    {% if shared_answer %}
    <div class="alert alert-warning">
        <strong>⚠️ Atención:</strong> Esta respuesta está asociada a otras preguntas.
        <div class="form-check mt-2">
            <input class="form-check-input" type="radio" name="update_all_answers" id="updateAll" value="yes" checked>
            <label class="form-check-label" for="updateAll">
                Actualizar la respuesta para TODAS las preguntas
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="update_all_answers" id="createNew" value="no">
            <label class="form-check-label" for="createNew">
                Crear una nueva respuesta solo para esta pregunta
            </label>
        </div>
    </div>
    {% endif %}

    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
    <a href="/admin" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
