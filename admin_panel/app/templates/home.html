{% extends "base.html" %}

{% block title %}Inicio - Panel de Administración{% endblock %}

{% block content %}
<div class="row mt-5">
  <div class="col-md-6 offset-md-3">
    <h2 class="mb-4">Información del Usuario</h2>
    <div class="mb-3">
      <strong>Correo Electrónico:</strong>
      <p id="userEmail" class="text-muted">Cargando...</p>
    </div>

    <div class="mb-3">
      <strong>Nombre Completo:</strong>
      <p id="userFullName" class="text-muted">No especificado</p>
    </div>

    <div class="mb-4">
      <strong>Estado de la Cuenta:</strong>
      <p>
        <span id="userStatus" class="badge bg-success">Activa</span>
      </p>
    </div>

    <button class="btn btn-danger w-100" onclick="logout()">
      Cerrar Sesión
    </button>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/home.js"></script>
{% endblock %}
