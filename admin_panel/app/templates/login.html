<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Administración Chatbot FAMAF</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="card">
        <div class="card-header bg-dark">
          <h1>Iniciar Sesión</h1>
        </div>
        <div class="card-body">
          <!-- Mensajes de Alerta -->
          <div
            id="message"
            class="alert alert-dismissible fade"
            role="alert"
            style="display: none"
          >
            <span id="messageText"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>

          <!-- Formulario de Inicio de Sesión -->
          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input
                type="email"
                autocomplete="email"
                class="form-control"
                id="email"
                name="email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <div class="input-group">
                <input
                  type="password"
                  autocomplete="current-password"
                  class="form-control"
                  id="password"
                  name="password"
                  required
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="togglePassword"
                >
                  <i id="toggleIcon" class="fas fa-eye"></i>
                </button>
              </div>
              <div class="forgot-password">
                <a href="#" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 bg-dark">
              <span id="buttonText">Iniciar Sesión</span>
              <span
                id="buttonSpinner"
                class="spinner-border spinner-border-sm"
                role="status"
                aria-hidden="true"
                style="display: none"
              ></span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="forgotPasswordModal"
      tabindex="-1"
      aria-labelledby="forgotPasswordModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="forgotPasswordModalLabel">
              Recuperar contrasena
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            Comunicate con <span id="supportEmailText">admin1@famaf.unc.edu.ar</span>
            para gestionar el cambio de contrasena.
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-primary" id="copyEmailButton">
              Copiar email
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/login.js"></script>
  </body>
</html>
